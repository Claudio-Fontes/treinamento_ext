<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1633"/>
      <stop offset="1" stop-color="#120f26"/>
    </linearGradient>
    <linearGradient id="coord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f62e6"/>
      <stop offset="1" stop-color="#5a4dd4"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c3fb0"/>
      <stop offset="1" stop-color="#3d3196"/>
    </linearGradient>
    <linearGradient id="modelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1b0"/>
      <stop offset="1" stop-color="#33b892"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f86c9"/>
    </marker>
  </defs>


  <!-- connectors: coordenador -> subagentes -->
  <g fill="none" stroke="#8f86c9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M480,182 C480,220 190,210 190,258"/>
    <path d="M480,182 L480,258"/>
    <path d="M480,182 C480,220 770,210 770,258"/>
  </g>

  <!-- connectors: subagentes -> modelos -->
  <g fill="none" stroke="#4fd1b0" stroke-width="3" marker-end="url(#arrow)" opacity="0.85">
    <path d="M190,382 L190,458"/>
    <path d="M480,382 L480,458"/>
    <path d="M770,382 L770,458"/>
  </g>

  <!-- coordenador -->
  <rect x="330" y="70" width="300" height="112" rx="24" fill="url(#coord)" filter="url(#soft)"/>
  <text x="480" y="118" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">coordenador</text>
  <text x="480" y="148" text-anchor="middle" fill="#e2defb" font-size="14">recebe a tarefa e distribui o trabalho</text>

  <!-- subagentes -->
  <g>
    <rect x="70" y="258" width="240" height="124" rx="22" fill="url(#sub)" filter="url(#soft)"/>
    <text x="190" y="308" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">subagente</text>
    <text x="190" y="336" text-anchor="middle" fill="#cfc9f5" font-size="13">ex.: pesquisa</text>
  </g>
  <g>
    <rect x="360" y="258" width="240" height="124" rx="22" fill="url(#sub)" filter="url(#soft)"/>
    <text x="480" y="308" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">subagente</text>
    <text x="480" y="336" text-anchor="middle" fill="#cfc9f5" font-size="13">ex.: código</text>
  </g>
  <g>
    <rect x="650" y="258" width="240" height="124" rx="22" fill="url(#sub)" filter="url(#soft)"/>
    <text x="770" y="308" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">subagente</text>
    <text x="770" y="336" text-anchor="middle" fill="#cfc9f5" font-size="13">ex.: revisão</text>
  </g>

  <!-- modelos -->
  <g>
    <rect x="90" y="458" width="200" height="104" rx="20" fill="url(#modelo)" filter="url(#soft)"/>
    <text x="190" y="518" text-anchor="middle" fill="#0c2b23" font-size="22" font-weight="800">modelo</text>
  </g>
  <g>
    <rect x="380" y="458" width="200" height="104" rx="20" fill="url(#modelo)" filter="url(#soft)"/>
    <text x="480" y="518" text-anchor="middle" fill="#0c2b23" font-size="22" font-weight="800">modelo</text>
  </g>
  <g>
    <rect x="670" y="458" width="200" height="104" rx="20" fill="url(#modelo)" filter="url(#soft)"/>
    <text x="770" y="518" text-anchor="middle" fill="#0c2b23" font-size="22" font-weight="800">modelo</text>
  </g>

  <!-- caption -->
  <text x="480" y="628" text-anchor="middle" fill="#6b63a3" font-size="15">as setas mostram a delegação: o coordenador comanda os subagentes, cada um apoiado por um modelo</text>
</svg>
