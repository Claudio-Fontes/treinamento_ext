<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1633"/>
      <stop offset="1" stop-color="#120f26"/>
    </linearGradient>
    <linearGradient id="multiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c3fb0"/>
      <stop offset="1" stop-color="#3d3196"/>
    </linearGradient>
    <linearGradient id="agenteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f62e6"/>
      <stop offset="1" stop-color="#5a4dd4"/>
    </linearGradient>
    <linearGradient id="modeloGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1b0"/>
      <stop offset="1" stop-color="#33b892"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="960" height="720" fill="url(#bgGrad)"/>

  <!-- multi layer -->
  <rect x="70" y="70" width="820" height="580" rx="38" fill="url(#multiGrad)" filter="url(#soft)"/>
  <text x="480" y="120" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="1">multi-agente</text>
  <text x="480" y="150" text-anchor="middle" fill="#cfc9f5" font-size="16" font-weight="400">vários agentes que se coordenam para uma meta comum</text>

  <!-- agente layer -->
  <rect x="150" y="180" width="660" height="410" rx="34" fill="url(#agenteGrad)" filter="url(#soft)"/>
  <text x="480" y="228" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700" letter-spacing="1">agente</text>
  <text x="480" y="256" text-anchor="middle" fill="#e2defb" font-size="15" font-weight="400">modelo + ferramentas + memória + loop de decisão</text>

  <!-- modelo layer -->
  <rect x="250" y="290" width="460" height="260" rx="28" fill="url(#modeloGrad)" filter="url(#soft)"/>
  <text x="480" y="410" text-anchor="middle" fill="#0c2b23" font-size="34" font-weight="800" letter-spacing="1">modelo</text>
  <text x="480" y="440" text-anchor="middle" fill="#0c2b23" font-size="15" font-weight="500" opacity="0.85">o LLM que raciocina e gera respostas</text>
</svg>
